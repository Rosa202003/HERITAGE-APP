<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Urithi Majengo</title>
    <meta
      name="description"
      content="Create an account to leave feedback on heritage buildings in Dar es Salaam."
    />

    <!-- ===== FAVICON ===== -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23D4AF37' d='M50 10 L10 40 L90 40 Z M20 40 L20 80 L35 80 L35 40 M45 40 L45 80 L55 80 L55 40 M65 40 L65 80 L80 80 L80 40 M10 80 L90 80 L90 90 L10 90 Z'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23D4AF37' d='M50 10 L10 40 L90 40 Z M20 40 L20 80 L35 80 L35 40 M45 40 L45 80 L55 80 L55 40 M65 40 L65 80 L80 80 L80 40 M10 80 L90 80 L90 90 L10 90 Z'/%3E%3C/svg%3E" />

    <!-- ===== GOOGLE FONTS ===== -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />

    <!-- ===== CUSTOM CSS ===== -->
    <link rel="stylesheet" href="../CSS/style.css" type="text/css" />

    <style>
      /* SIGNUP PAGE STYLES */
      .signup-page-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(12, 30, 26, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 20px;
      }

      .signup-modal {
        max-width: 420px;
        width: 100%;
        background: var(--card);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        padding: 40px 36px 36px;
        box-shadow: var(--shadow-lg);
        position: relative;
        max-height: 90vh;
        overflow-y: auto;
      }

      .signup-modal-close {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 32px;
        height: 32px;
        background: var(--bg-hover, #f3f4f6);
        border: none;
        border-radius: 50%;
        font-size: 20px;
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .signup-modal .signup-logo {
        text-align: center;
        margin-bottom: 24px;
      }

      .signup-modal .signup-logo .logo-icon {
        font-family: var(--font-display);
        font-size: 28px;
        font-weight: 700;
        color: var(--gold);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: 2px solid var(--gold);
      }

      .signup-modal .signup-header {
        text-align: center;
        margin-bottom: 28px;
      }

      .signup-modal .signup-header h1 {
        font-family: var(--font-display);
        font-size: 28px;
        color: var(--text);
        margin-bottom: 4px;
      }

      .signup-modal .form-group {
        margin-bottom: 20px;
      }

      .signup-modal label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      .signup-modal input {
        width: 100%;
        padding: 12px 14px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-size: 14px;
        outline: none;
      }

      .signup-modal .btn-submit {
        width: 100%;
        padding: 14px;
        background: var(--gold);
        color: var(--dark);
        border: none;
        border-radius: var(--radius-sm);
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 10px;
      }

      .signup-modal .signup-message {
        text-align: center;
        font-size: 13px;
        margin-top: 12px;
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        display: none;
      }

      .signup-modal .signup-message.error {
        display: block;
        background: #f8d7da;
        color: #721c24;
      }

      .signup-modal .signup-message.success {
        display: block;
        background: #d4edda;
        color: #155724;
      }

      .signup-modal .signup-footer {
        text-align: center;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }

      .signup-modal .signup-footer a {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div id="layout-header"></div>

    <div class="signup-page-overlay" id="signup-overlay">
      <div class="signup-modal">
        <button class="signup-modal-close" onclick="closeSignup()" aria-label="Close signup">✕</button>
        <div class="signup-logo">
          <span class="logo-icon">UM</span>
        </div>
        <div class="signup-header">
          <h1>Create Account</h1>
          <p>Register to participate in community discussions</p>
        </div>
        <form class="signup-form" id="signupForm" onsubmit="handleSignup(event)" novalidate>
          <div class="form-group">
            <label for="signup-name">Full Name</label>
            <input type="text" id="signup-name" placeholder="Your full name" required />
          </div>
          <div class="form-group">
            <label for="signup-email">Email Address</label>
            <input type="email" id="signup-email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" placeholder="•••••••••" required />
          </div>
          <button type="submit" class="btn-submit" id="signup-btn">Create Account →</button>
          <div class="signup-message" id="signup-message" role="alert"></div>
        </form>
        <div class="signup-footer">
          <p>Already have an account? <a href="login.html">Sign In</a></p>
        </div>
      </div>
    </div>

    <div id="layout-footer"></div>

    <script src="../JS/data.js"></script>
    <script src="../JS/api.js"></script>
    <script src="../JS/components/header.js"></script>
    <script src="../JS/components/footer.js"></script>
    <script src="../JS/layout.js"></script>
    <script>
      function closeSignup() {
        window.location.href = "index.html";
      }

      async function handleSignup(e) {
        e.preventDefault();
        const name = document.getElementById("signup-name").value.trim();
        const email = document.getElementById("signup-email").value.trim();
        const password = document.getElementById("signup-password").value.trim();
        const message = document.getElementById("signup-message");
        const btn = document.getElementById("signup-btn");

        message.className = "signup-message";
        message.textContent = "";

        if (!name || !email || !password) {
          message.className = "signup-message error";
          message.textContent = "Please fill in all fields.";
          return;
        }

        if (!email.includes("@")) {
          message.className = "signup-message error";
          message.textContent = "Please enter a valid email address.";
          return;
        }

        if (password.length < 6) {
          message.className = "signup-message error";
          message.textContent = "Password must be at least 6 characters.";
          return;
        }

        btn.disabled = true;
        btn.textContent = "Creating account…";

        try {
          const result = await API.register(name, email, password);
          if (result.user || result.token || (result.message && result.message.toLowerCase().includes("success"))) {
            message.className = "signup-message success";
            message.textContent = "Account created successfully! Redirecting to sign in…";
            setTimeout(() => {
              window.location.href = "login.html";
            }, 1500);
          } else {
            message.className = "signup-message error";
            message.textContent = result.message || "Registration failed.";
            btn.disabled = false;
            btn.textContent = "Create Account →";
          }
        } catch (err) {
          message.className = "signup-message error";
          message.textContent = err.message || "Could not reach server. Is the backend running?";
          btn.disabled = false;
          btn.textContent = "Create Account →";
        }
      }
    </script>
  </body>
</html>
