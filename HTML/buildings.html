<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Buildings - Urithi Majengo</title>
    <meta
      name="description"
      content="Complete georeferenced records of all listed and proposed heritage structures in Dar es Salaam."
    />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23D4AF37' d='M50 10 L10 40 L90 40 Z M20 40 L20 80 L35 80 L35 40 M45 40 L45 80 L55 80 L55 40 M65 40 L65 80 L80 80 L80 40 M10 80 L90 80 L90 90 L10 90 Z'/%3E%3C/svg%3E" />

    <!-- ===== PANNELLUM 360 CSS ===== -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"
    />

    <!-- ===== LEAFLET CSS ===== -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- ===== CUSTOM CSS ===== -->
    <link rel="stylesheet" href="../CSS/style.css" />
    <link rel="stylesheet" href="../CSS/styles.css" />
    <link rel="stylesheet" href="../CSS/grid-view.css" />
  </head>
  <body>
    <div id="app">
      <div id="layout-header"></div>

      <main class="main-content">
        <div class="hero-section">
          <h1>Heritage Building Inventory</h1>
          <p>
            Complete georeferenced records of all listed and proposed heritage
            structures.
          </p>
        </div>

        <div class="search-container">
          <div class="search-wrapper">
            <input
              type="text"
              id="searchInput"
              placeholder="Search buildings..."
            />
          </div>
          <span class="results-count" id="resultsCount">Loading...</span>
        </div>

        <div class="building-grid" id="buildingGrid">
          <div
            style="
              grid-column: 1/-1;
              text-align: center;
              padding: 60px 20px;
              color: var(--text-muted);
            "
          >
            <div style="font-size: 24px; margin-bottom: 16px"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></div>
            <p>Loading buildings...</p>
          </div>
        </div>
      </main>

      <!-- BUILDING MODAL -->
      <div
        id="building-modal"
        class="modal-overlay bm-overlay hidden"
        onclick="handleOverlayClick(event, 'building-modal')"
      >
        <div class="building-modal">
          <div class="bm-hero">
            <img id="bm-img" src="" alt="" />
            <div class="bm-hero-overlay"></div>
            <button class="bm-close" onclick="closeModal('building-modal')">
              &#x2715;
            </button>
            <div class="bm-title-wrap">
              <div class="bm-id" id="bm-id"></div>
              <div class="bm-name" id="bm-name"></div>
              <div class="bm-badge-row" id="bm-badges"></div>
            </div>
          </div>
          <div class="bm-meta-strip">
            <div class="bm-meta-cell">
              <div class="bm-meta-label">District</div>
              <div class="bm-meta-value" id="bm-district"></div>
            </div>
            <div class="bm-meta-cell">
              <div class="bm-meta-label">Built</div>
              <div class="bm-meta-value" id="bm-year"></div>
            </div>
            <div class="bm-meta-cell">
              <div class="bm-meta-label">Area</div>
              <div class="bm-meta-value" id="bm-area"></div>
            </div>
            <div class="bm-meta-cell">
              <div class="bm-meta-label">Legal</div>
              <div class="bm-meta-value" id="bm-legal"></div>
            </div>
          </div>
          <div class="bm-tabs">
            <button
              class="bm-tab active"
              onclick="switchBMTab('overview', this)"
            >
              Overview
            </button>
            <button class="bm-tab" onclick="switchBMTab('tour', this)">
              360&#xB0; Tour
            </button>
            <button
              class="bm-tab"
              onclick="switchBMTab('reviews', this)"
              id="reviews-tab-btn"
            >
              Reviews
            </button>
          </div>
          <div class="bm-content">
            <div id="bm-tab-overview"></div>
            <div id="bm-tab-tour" style="display: none"></div>
            <div id="bm-tab-reviews" style="display: none"></div>
          </div>
        </div>
      </div>

      <div id="layout-footer"></div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <!-- Load data and API first -->
    <script src="../JS/data.js"></script>
    <script src="../JS/api.js"></script>

    <script>
      // ========================================
      // LOAD BUILDINGS - WITH CACHING
      // ========================================

      async function loadBuildings() {
        const grid = document.getElementById("buildingGrid");
        const countEl = document.getElementById("resultsCount");
        if (!grid) return;

        console.log("Loading buildings...");

        const urlParams = new URLSearchParams(window.location.search);
        const q = urlParams.get("q");
        let fetchParams = {};

        if (q) {
          fetchParams.q = q;
          const searchInput = document.getElementById("searchInput");
          if (searchInput) searchInput.value = q;
        }

        try {
          let buildings = [];

          if (typeof API !== "undefined" && API.getBuildings) {
            try {
              buildings = await API.getBuildings(fetchParams);
              console.log("Loaded from API:", buildings.length, "buildings");
            } catch (apiError) {
              console.log("API failed, using fallback:", apiError.message);
            }
          }

          if (!buildings || buildings.length === 0) {
            if (typeof MOCK_BUILDINGS !== "undefined") {
              if (q) {
                const qLower = q.toLowerCase();
                buildings = MOCK_BUILDINGS.filter(
                  (b) =>
                    (b.name || "").toLowerCase().includes(qLower) ||
                    (b.location || "").toLowerCase().includes(qLower) ||
                    (b.era || "").toLowerCase().includes(qLower),
                );
              } else {
                buildings = MOCK_BUILDINGS;
              }
              console.log("Using MOCK_BUILDINGS:", buildings.length);
            }
          }

          if (!buildings || buildings.length === 0) {
            grid.innerHTML = `
                    <div style="text-align:center;padding:60px 20px;color:var(--text-muted);grid-column:1/-1;">
                        <div style="font-size:32px;margin-bottom:16px;"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
                        <p>No buildings found. Make sure the backend is running.</p>
                        <button class="btn-primary" onclick="location.reload()" style="margin-top:16px;">Reload</button>
                    </div>
                `;
            if (countEl) countEl.textContent = "0 results";
            return;
          }

          renderBuildingCards(buildings);
        } catch (error) {
          console.error("Error loading buildings:", error);
          grid.innerHTML = `
                <div style="text-align:center;padding:60px 20px;color:var(--text-muted);grid-column:1/-1;">
                    <div style="font-size:32px;margin-bottom:16px;"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div>
                    <p>Error loading buildings. Please try again.</p>
                    <button class="btn-primary" onclick="location.reload()" style="margin-top:16px;">Reload</button>
                </div>
            `;
          if (countEl) countEl.textContent = "Error";
        }
      }

      function renderBuildingCards(buildings) {
        const grid = document.getElementById("buildingGrid");
        const countEl = document.getElementById("resultsCount");

        if (countEl) {
          countEl.textContent = `${buildings.length} result${buildings.length !== 1 ? "s" : ""}`;
        }

        grid.innerHTML = buildings
          .map(
            (b) => `
            <div class="building-card" onclick="openBuildingModalById(${b.id})" style="cursor:pointer;">
                <img src="${b.image || "https://via.placeholder.com/600x400/cccccc/666?text=Heritage+Building"}"
                     alt="${b.name}"
                     class="card-image"
                     onerror="this.src='https://via.placeholder.com/600x400/cccccc/666?text=No+Image'">
                <div class="card-body">
                    <div class="card-header">
                        <h3>${b.name}</h3>
                        <span class="card-code">${b.code || "DSH-" + String(b.id).padStart(3, "0")}</span>
                    </div>
                    <div class="card-meta">
                        <span>${b.era || "Heritage Era"}</span>
                        <span>${b.year || "Historic"}</span>
                        <span>${b.location || "Dar es Salaam"}</span>
                    </div>
                    <div class="card-tags">
                        <span class="tag tag-360"><svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:3px;vertical-align:-1px"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>360° Panorama</span>
                        ${b.tags && b.tags.includes("At Risk") ? '<span class="tag tag-at-risk"><svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="margin-right:3px;vertical-align:-1px"><path d="M4 2v20h2v-8h14l-3-5 3-5H6V2H4zm2 4h11.47l-2 3.33 2 3.34H6V6z"/></svg>AT RISK</span>' : ""}
                    </div>
                    <div class="card-footer" style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
                        <span class="badge badge-${b.condition ? b.condition.toLowerCase() : 'good'}">${b.condition || 'Good'}</span>
                        <button onclick="event.stopPropagation(); openBuildingModalById(${b.id}, 'tour')" style="background:var(--gold,#d4af37);color:#111;border:none;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;box-shadow:0 2px 8px rgba(0,0,0,0.3);">
                           360° Tour
                        </button>
                    </div>
                </div>
            </div>
        `,
          )
          .join("");

        console.log("Rendered", buildings.length, "building cards");
      }

      // Search functionality
      const searchInput = document.getElementById("searchInput");
      if (searchInput) {
        searchInput.addEventListener("input", function () {
          const query = this.value.toLowerCase().trim();
          const cards = document.querySelectorAll(".building-card");

          cards.forEach((card) => {
            const text = card.textContent.toLowerCase();
            card.style.display = text.includes(query) ? "" : "none";
          });

          const visible = Array.from(cards).filter(
            (c) => c.style.display !== "none",
          ).length;
          const countEl = document.getElementById("resultsCount");
          if (countEl)
            countEl.textContent = `${visible} result${visible !== 1 ? "s" : ""}`;
        });
      }

      // Load buildings on page load
      document.addEventListener("DOMContentLoaded", function () {
        console.log("DOM loaded, initializing buildings page");
        loadBuildings();

        const urlParams = new URLSearchParams(window.location.search);
        const bId = urlParams.get('id');
        if (bId) {
          setTimeout(async () => {
            try {
              if (typeof API !== 'undefined' && API.getBuilding) {
                const b = await API.getBuilding(bId);
                if (b && typeof openBuildingModal === 'function') {
                  openBuildingModal(b, 'reviews');
                }
              }
            } catch (e) {}
          }, 500);
        }
      });
    </script>

    <!-- Load app.js last -->
    <script src="../JS/app.js?v=3"></script>
    <!-- COMPONENTS -->
    <script src="../JS/components/header.js"></script>
    <script src="../JS/components/footer.js"></script>
    <script src="../JS/layout.js"></script>
  </body>
</html>
